[package]
name = "daily-luck"
version = "0.2.3"
edition = "2021"
description = "Rust port of the PCL2 / PCLCE daily-luck (今日人品) algorithms from Zyx-2012/daily-luck"
license = "MIT"

[dependencies]
# GUI framework
eframe = "0.28"

# Date handling
chrono = "0.4"

# Random number generation
rand = "0.8"

# Pure-function dependencies (cross-platform).
sha2 = "0.10"
hex = "0.4"

# Windows-only system-access dependencies.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
wmi = "0.14"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"